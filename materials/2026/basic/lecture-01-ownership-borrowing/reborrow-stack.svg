<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 340" role="img" aria-labelledby="title desc">
  <title id="title">Exclusive reborrow permissions</title>
  <desc id="desc">A simplified Stacked Borrows trace. The outer permission is present first. A reborrow adds inner above it. Writing through outer removes inner, so a later access through inner would be invalid.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8" fill="none" stroke="black" stroke-width="1.5"/>
    </marker>
  </defs>
  <g fill="black" font-family="Times New Roman, serif" font-size="36" text-anchor="middle">
    <text x="180" y="42">Borrow</text>
    <text x="580" y="42">Reborrow</text>
    <text x="980" y="42">Write through outer</text>
  </g>
  <g fill="none" stroke="black" stroke-width="3">
    <rect x="80" y="158" width="200" height="64"/>
    <rect x="480" y="158" width="200" height="64"/>
    <rect x="480" y="94" width="200" height="64"/>
    <rect x="880" y="158" width="200" height="64"/>
    <path d="M310 190 H444" marker-end="url(#arrow)"/>
    <path d="M710 190 H844" marker-end="url(#arrow)"/>
  </g>
  <g fill="black" font-family="monospace" font-size="32" text-anchor="middle">
    <text x="180" y="201">outer</text>
    <text x="580" y="201">outer</text>
    <text x="580" y="137">inner</text>
    <text x="980" y="201">outer</text>
  </g>
  <g fill="black" font-family="monospace" font-size="27" text-anchor="middle">
    <text x="180" y="280">let outer =</text>
    <text x="180" y="316">&amp;mut value;</text>
    <text x="580" y="280">let inner =</text>
    <text x="580" y="316">&amp;mut *outer;</text>
    <text x="980" y="298">*outer += 1;</text>
  </g>
</svg>
