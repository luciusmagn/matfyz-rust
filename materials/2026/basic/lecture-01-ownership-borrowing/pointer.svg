<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 340" role="img" aria-labelledby="title desc">
  <title id="title">A pointer and its referent</title>
  <desc id="desc">The pointer refers to an integer value 7 at the illustrative address 0x1000. Following the arrow represents dereferencing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8" fill="none" stroke="black" stroke-width="1.5"/>
    </marker>
  </defs>
  <g fill="black" font-family="Times New Roman, serif" font-size="36" text-anchor="middle">
    <text x="240" y="64">Pointer</text>
    <text x="910" y="64">Integer</text>
    <text x="578" y="140">Dereference</text>
  </g>
  <g fill="none" stroke="black" stroke-width="3">
    <rect x="100" y="110" width="280" height="120"/>
    <rect x="770" y="110" width="280" height="120"/>
    <path d="M385 170 H755" marker-end="url(#arrow)"/>
  </g>
  <g fill="black" font-family="monospace" font-size="44" text-anchor="middle">
    <text x="240" y="187">0x1000</text>
    <text x="910" y="187">7</text>
  </g>
  <g fill="black" font-family="Times New Roman, serif" font-size="30" text-anchor="middle">
    <text x="240" y="284">Refers to an address</text>
    <text x="910" y="284">Stored at that address</text>
    <text x="910" y="324">0x1000 (illustrative)</text>
  </g>
</svg>
