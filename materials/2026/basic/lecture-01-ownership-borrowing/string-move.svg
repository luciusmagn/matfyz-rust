<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="340" viewBox="0 0 1160 340" role="img" aria-labelledby="title description">
  <title id="title">String ownership after a move</title>
  <desc id="description">After let second = first, the first binding is unavailable. The second binding owns the String and its existing heap buffer. The buffer is not duplicated.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="black" stroke-width="1.5"/></marker>
  </defs>
  <g fill="black" font-family="Times New Roman MT Std, Times New Roman, serif" font-size="36">
    <text x="35" y="42">After let second = first;</text>
    <g fill="none" stroke="black" stroke-width="2">
      <rect x="35" y="75" width="280" height="80" stroke-dasharray="8 6"/>
      <rect x="35" y="210" width="280" height="80"/>
      <rect x="780" y="210" width="300" height="80"/>
      <path d="M 880 210 V 290 M 980 210 V 290"/>
      <path d="M 327 250 H 767" marker-end="url(#arrow)"/>
    </g>
    <text x="62" y="127">first</text>
    <text x="362" y="127">Unavailable after the move</text>
    <text x="62" y="262">second</text>
    <text x="438" y="228">owns</text>
    <text x="780" y="186">Same buffer</text>
    <text x="830" y="262" text-anchor="middle">o</text>
    <text x="930" y="262" text-anchor="middle">a</text>
    <text x="1030" y="262" text-anchor="middle">k</text>
  </g>
</svg>
